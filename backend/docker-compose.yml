services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agentflow_api

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      ENVIRONMENT: production
      DEBUG: "False"

      DATABASE_URL: postgresql+asyncpg://agentflow_user:agentflow_password@postgres:5432/agentflow_db

      REDIS_HOST: redis
      REDIS_PORT: 6379

      LLM_PROVIDER: ${LLM_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - agentflow_net

  postgres:
    image: postgres:16-alpine

    container_name: agentflow_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: agentflow_user
      POSTGRES_PASSWORD: agentflow_password
      POSTGRES_DB: agentflow_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow_user -d agentflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - agentflow_net

  redis:
    image: redis:7-alpine

    container_name: agentflow_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - agentflow_net

volumes:
  postgres_data:
  redis_data:

networks:
  agentflow_net:
    driver: bridge